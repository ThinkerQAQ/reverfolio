name: Go
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go test -race ./...
      - run: go vet ./...
      - name: Verify all resolved dependency licenses can be bundled
        run: python scripts/bundle_dependency_licenses.py --check
      - run: go build ./cmd/reverfolio
      - name: Verify real MCP protocol and 39-tool contract with an isolated database
        run: python scripts/check_mcp_contract.py --fixture
      - name: Check Windows MCP command survives tunnel-client shell parsing
        if: runner.os == 'Windows'
        run: python scripts/check_windows_mcp_command.py
