<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenEcho</title>
<style>body{font:16px system-ui;max-width:1050px;margin:40px auto;padding:0 20px;background:#f4f6f8;color:#172b3a}h1{margin-bottom:0}section{background:white;border:1px solid #d8e0e6;border-radius:12px;padding:22px;margin:20px 0}input,button{font:inherit;padding:10px;margin:5px 4px 5px 0}button{background:#126c68;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#506473}label{display:block}#message{white-space:pre-wrap}</style>
<h1>OpenEcho</h1><p>Open-source and content impact · GitHub foundation preview</p>
<section><label>Local API token <input id="token" type="password" autocomplete="off" placeholder="Enter startup token"></label><small>Stored only in this page's memory. This preview covers repository registration and manual snapshots; evidence discovery and MCP are planned.</small><p><button id="load">Load repositories</button></p></section>
<section><h2>Register repository</h2><form id="register"><label>Title <input id="title" required maxlength="200"></label><label>GitHub repository <input id="repo" placeholder="owner/repository" required></label><button>Add repository</button></form></section>
<p id="message" role="status" aria-live="polite"></p><main id="works"></main>
<script>
const el=id=>document.getElementById(id);let busy=false;
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+el('token').value,...options.headers}});if(!response.ok)throw Error(await response.text());return response.json()}
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{el('message').textContent='Working…';await fn();el('message').textContent='Updated.'}catch(e){el('message').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(){const works=await api('/api/works');el('works').replaceChildren();for(const w of works){const section=document.createElement('section'),title=document.createElement('h2'),meta=document.createElement('small'),button=document.createElement('button'),pre=document.createElement('pre');title.textContent=w.title;meta.textContent=w.repository;button.textContent='Collect snapshot';section.append(title,meta,document.createElement('p'),button,pre);el('works').append(section);const refresh=async()=>{const snapshots=await api('/api/works/'+w.id+'/snapshots'),changes=await api('/api/works/'+w.id+'/changes');pre.textContent=JSON.stringify({latest:snapshots[0]||'No snapshot yet',download_changes:changes},null,2)};button.onclick=()=>action(async()=>{await api('/api/works/'+w.id+'/collect',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()}});await refresh()});await refresh()}}
el('load').onclick=()=>action(load);el('register').onsubmit=e=>{e.preventDefault();action(async()=>{await api('/api/works',{method:'POST',body:JSON.stringify({title:el('title').value,repository:el('repo').value})});await load()})};
</script></html>
